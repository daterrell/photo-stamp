name: CI

# Checks every push and pull request; on success builds the Windows zip. Pushes to main and
# version tags also publish the Docker image to Forgejo's registry, and v* tags create a GitHub
# Release.
#
# Runs on the self-hosted Forgejo runner. Its Docker daemon keeps images, build layers and the
# dev.sh cargo volumes between runs, so there's no cache-from/cache-to to manage.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: forgejo.terrell.ltd

jobs:
  check:
    name: Tests, clippy, rustfmt
    runs-on: ubuntu-24.04
    env:
      # The runner's Docker daemon can't bind-mount this checkout; see dev.sh.
      DEV_SH_COPY_SOURCE: "1"
    steps:
      - uses: actions/checkout@v4
      # dev.sh runs everything in the dev image, which has the exiftool, libheif and fonts the
      # tests need.
      - name: rustfmt
        run: ./dev.sh cargo fmt --all --check
      - name: clippy
        run: ./dev.sh cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: ./dev.sh cargo test --workspace --locked

  check-windows:
    name: Clippy (Windows target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # HEIC (libheif) is linked statically in the real build; without it this still checks all the
      # Windows-only code.
      - run: cargo clippy --workspace --target x86_64-pc-windows-gnu --no-default-features --all-targets --locked -- -D warnings

  places:
    name: Place data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Rebuilt monthly (GeoNames and Wikidata change slowly) and when the build script changes. The
      # public Wikidata endpoint rate-limits, so a failed rebuild falls back to the previous database
      # instead of holding up the Windows zip, Docker image and releases.
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: db
        uses: actions/cache/restore@v4
        with:
          path: data/places.sqlite
          key: places-db-${{ steps.month.outputs.month }}-${{ hashFiles('scripts/build-places-db.py') }}
          restore-keys: places-db-
      - uses: actions/cache@v4
        if: steps.db.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/photo-stamp-dev/places-src
          key: places-src-${{ steps.month.outputs.month }}
          restore-keys: places-src-
      - name: Rebuild places.sqlite
        id: build
        if: steps.db.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: python3 scripts/build-places-db.py data/new-places.sqlite && mv data/new-places.sqlite data/places.sqlite
      - name: Fall back to the previous place data
        if: steps.build.outcome == 'failure'
        run: |
          test -f data/places.sqlite || { echo "::error::couldn't build the place data and no previous build is cached"; exit 1; }
          echo "::warning::couldn't rebuild the place data this month; using the previous build"
      - uses: actions/cache/save@v4
        if: steps.build.outcome == 'success'
        with:
          path: data/places.sqlite
          key: places-db-${{ steps.month.outputs.month }}-${{ hashFiles('scripts/build-places-db.py') }}
      # Clients get the small towns database; the place server builds its own full one.
      - run: python3 scripts/make-towns-db.py data/places.sqlite data/towns.sqlite && ls -la data/
      # Forgejo's fork: GitHub's upload/download-artifact v4+ don't work against Forgejo.
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: places-db
          path: |
            data/places.sqlite
            data/towns.sqlite
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows zip
    needs: [check, check-windows, places]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: places-db
          path: data
      # The static libde265/x265/libheif build takes ~10 minutes; the runner's persistent layer
      # cache skips it.
      - name: Build photo-stamp.exe and photo-stamp-ui.exe
        run: docker build -f docker/Dockerfile.windows --target exe -o type=local,dest=build-out .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/photo-stamp-dev/downloads
          key: downloads-${{ hashFiles('scripts/build-windows.sh') }}
      - name: Package with exiftool and place data
        run: scripts/build-windows.sh
        env:
          PHOTO_STAMP_EXE: build-out/photo-stamp.exe
      - name: Only Windows system DLLs
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64 >/dev/null
          for exe in photo-stamp.exe photo-stamp-ui.exe; do
            x86_64-w64-mingw32-objdump -p "dist/photo-stamp-windows/$exe" | grep "DLL Name" | sort -uf | tee dlls.txt
            if grep -iE "libgcc|libstdc|libwinpthread|libheif|libde265|x265" dlls.txt; then
              echo "::error::$exe depends on non-system DLLs"
              exit 1
            fi
          done
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: photo-stamp-windows
          path: dist/photo-stamp-windows/
          if-no-files-found: error
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: photo-stamp-windows-zip
          path: dist/photo-stamp-windows.zip
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image
    needs: [check, places]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: places-db
          path: data
      # The automatic token can't push packages, so this uses a token with package write access.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  server:
    name: Place server image
    needs: check
    runs-on: ubuntu-24.04
    env:
      # Unique per run: concurrent runs share the runner's Docker daemon.
      SRV: ps-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f docker/Dockerfile.server -t photo-stamp-server:ci-${{ github.run_id }} .
      # Smoke test: a real lookup with the test place data and a fresh device key. The runner's
      # daemon can't bind-mount this checkout or publish ports to the job, so the data goes in
      # through a named volume and the requests come from a container on the server's network.
      - name: Smoke test
        run: |
          img=photo-stamp-server:ci-${{ github.run_id }}
          docker volume create "$SRV" >/dev/null
          docker network create "$SRV" >/dev/null
          trap 'docker rm -f "$SRV" >/dev/null 2>&1; docker network rm "$SRV" >/dev/null 2>&1; docker volume rm "$SRV" >/dev/null 2>&1' EXIT
          c=$(docker create -v "$SRV:/data" "$img")
          docker cp tests/fixtures/places.sqlite "$c:/data/places.sqlite"
          docker rm "$c" >/dev/null
          run() { docker run --rm -v "$SRV:/data" "$img" "$@"; }
          run user add ci
          key=$(run device add ci runner | grep -o 'psk_[0-9a-f_]*')
          docker run -d --name "$SRV" --network "$SRV" -v "$SRV:/data" "$img" serve --offline >/dev/null
          curl() { docker run --rm --network "$SRV" curlimages/curl:8.11.1 "$@"; }
          for _ in $(seq 30); do curl -sf "http://$SRV:8080/healthz" && break; sleep 1; done
          curl -sf -H "Authorization: Bearer $key" -d '{"lat":48.8556,"lon":2.2986}' "http://$SRV:8080/v1/place" | tee reply.json
          grep -q Paris reply.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -d '{"lat":1,"lon":1}' "http://$SRV:8080/v1/place")" = 401
      # The automatic token can't push packages, so this uses a token with package write access.
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-server
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            docker tag "photo-stamp-server:ci-${{ github.run_id }}" "$tag"
            docker push "$tag"
          done
      - name: Remove the test image tag
        if: always()
        run: docker rmi "photo-stamp-server:ci-${{ github.run_id }}" >/dev/null 2>&1 || true

  release:
    name: GitHub Release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      # Releases are published on GitHub. Forgejo push-mirrors the repo there, tags included.
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      GH_REPO: daterrell/photo-stamp
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: photo-stamp-windows-zip
      - name: Install gh
        run: |
          curl -fsSL https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz | tar xz -C /tmp
          sudo install /tmp/gh_2.102.0_linux_amd64/bin/gh /usr/local/bin/gh
      - name: Wait for the push mirror to bring the tag to GitHub
        run: |
          for _ in $(seq 60); do
            gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --silent 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::$GITHUB_REF_NAME didn't reach github.com/$GH_REPO; check the repo's push mirror."
          exit 1
      - name: Create release
        run: |
          zip="photo-stamp-windows-${GITHUB_REF_NAME}.zip"
          mv photo-stamp-windows.zip "$zip"
          {
            echo "Unzip into an empty folder to drop photos into, and double-click \`photo-stamp.exe\`."
            echo "Stamped photos go to its \`outbox\` folder. Double-click \`photo-stamp-ui.exe\` to see and"
            echo "control what it's doing in your browser. See README.txt inside the zip."
            echo
            echo "Docker image: \`${REGISTRY}/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$zip" --verify-tag --title "photo-stamp $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes
