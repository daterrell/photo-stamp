name: CI

# Checks every push and pull request; on success builds the Windows zip. Pushes to main and
# version tags also publish the Docker images to Forgejo's registry.
#
# Versions come from git tags (scripts/version.sh): a build of tag v1.2.3 is 1.2.3, anything else
# is like 1.2.4-dev.7+g1b37dbe. Pushing a v*.*.* tag on a commit that's on main makes a release:
# the same build, promoted to the public (a GitHub Release, and :latest/:1.2.3 images).
#
# What's left after a run is only what's usable, published: the Windows zip in Forgejo's package
# registry (pushes to main = beta, v* tags = stable; auto-update reads it), the images in its
# container registry, and a GitHub Release for tags. Pull request builds keep their zip as a
# short-lived Actions artifact. Every job removes what it created, and the tidy job keeps the
# runner's shared caches bounded (Docker layer cache, main's cargo target volume, dev images).
#
# Runs on the self-hosted Forgejo runner, whose Docker daemon persists between runs.
on:
  # Branches are checked through their pull request; pushing to one too would build the same
  # commit twice at once.
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: forgejo.terrell.ltd
  # Windows builds in the generic package registry.
  PACKAGE: photo-stamp-windows
  # Kept per kind: newest beta zips, and sha-* image tags.
  KEEP_BUILDS: "10"

jobs:
  check:
    name: Tests, clippy, rustfmt
    runs-on: ubuntu-24.04
    env:
      # The runner's Docker daemon can't bind-mount this checkout; see dev.sh.
      DEV_SH_COPY_SOURCE: "1"
      # Main builds in its own long-lived target volume; anything else gets one for this run only
      # (seeded from main's), so runs at the same time can't clobber each other's crates.
      DEV_SH_TARGET: ${{ github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
      # dev.sh runs everything in the dev image, which has the exiftool, libheif and fonts the
      # tests need.
      - name: rustfmt
        run: ./dev.sh cargo fmt --all --check
      - name: clippy
        run: ./dev.sh cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: ./dev.sh cargo test --workspace --locked
      - name: Remove this run's target volume
        if: always() && env.DEV_SH_TARGET != 'main'
        run: docker volume rm "photo-stamp-dev-target-$DEV_SH_TARGET" >/dev/null 2>&1 || true

  check-windows:
    name: Clippy (Windows target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # HEIC (libheif) is linked statically in the real build; without it this still checks all the
      # Windows-only code.
      - run: cargo clippy --workspace --target x86_64-pc-windows-gnu --no-default-features --all-targets --locked -- -D warnings

  places:
    name: Place data
    runs-on: ubuntu-24.04
    env:
      TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # The newest place data, built monthly by dave/photo-stamp-places. Clients get only the small
      # towns database; the place server downloads the full one itself. Fetched once here so the
      # windows and docker jobs ship the same version.
      - run: scripts/fetch-places.sh data/towns.sqlite
      # Forgejo's fork: GitHub's upload/download-artifact v4+ don't work against Forgejo.
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: towns-db
          path: data/towns.sqlite
          if-no-files-found: error
          # Only passed to the later jobs of this run.
          retention-days: 1

  windows:
    name: Windows zip and setup
    needs: [check, check-windows, places]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        # All history and tags: scripts/version.sh describes the commit from the newest tag.
        with:
          fetch-depth: 0
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: towns-db
          path: data
      # The static libde265/x265/libheif build takes ~10 minutes; the runner's persistent layer
      # cache skips it.
      - name: Build photo-stamp.exe
        run: |
          docker build -f docker/Dockerfile.windows --target exe -o type=local,dest=build-out \
            --build-arg PHOTO_STAMP_VERSION="$(scripts/version.sh)" .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/photo-stamp-dev/downloads
          key: downloads-${{ hashFiles('scripts/build-windows.sh') }}
      - name: Install NSIS and mingw binutils
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends nsis binutils-mingw-w64-x86-64 >/dev/null
      - name: Package with exiftool and place data, and make the setup program
        run: scripts/build-windows.sh
        env:
          PHOTO_STAMP_EXE: build-out/photo-stamp.exe
      - name: Check the exe and the package
        run: |
          exe=dist/photo-stamp-windows/photo-stamp.exe
          x86_64-w64-mingw32-objdump -p "$exe" | grep "DLL Name" | sort -uf | tee dlls.txt
          if grep -iE "libgcc|libstdc|libwinpthread|libheif|libde265|x265" dlls.txt; then
            echo "::error::photo-stamp.exe depends on non-system DLLs"
            exit 1
          fi
          # The icon and manifest (assets/photo-stamp.rc) are linked in.
          x86_64-w64-mingw32-objdump -h "$exe" | grep -q "\.rsrc" \
            || { echo "::error::photo-stamp.exe has no resources (icon, manifest)"; exit 1; }
          # One program: the old separate dashboard must not come back.
          if python3 -m zipfile -l dist/photo-stamp-windows.zip | grep -q photo-stamp-ui; then
            echo "::error::the zip still has photo-stamp-ui.exe"
            exit 1
          fi
          test -s dist/photo-stamp-setup.exe
      # Pull requests: short-lived artifacts to try the build. Main and tags: published below.
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: photo-stamp-windows
          path: |
            dist/photo-stamp-setup.exe
            dist/photo-stamp-windows.zip
          if-no-files-found: error
          retention-days: 3
      # Main = beta, v* tags = stable (the version says which). Auto-update reads these.
      - name: Publish to the package registry
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          version=$(scripts/version.sh)
          v=${version//+/%2B}
          base="${{ github.server_url }}/api/packages/${{ github.repository_owner }}/generic/$PACKAGE/$v"
          # The zip is what auto-update installs; the setup program is for new installs.
          curl -sf -X PUT -H "Authorization: token $TOKEN" --upload-file dist/photo-stamp-windows.zip \
            "$base/photo-stamp-windows-$v.zip" || { echo "::error::couldn't publish $version"; exit 1; }
          curl -sf -X PUT -H "Authorization: token $TOKEN" --upload-file dist/photo-stamp-setup.exe \
            "$base/photo-stamp-setup-$v.exe" || { echo "::error::couldn't publish the setup for $version"; exit 1; }
          echo "published $PACKAGE $version"
      # Keep the newest beta builds; stable ones are kept.
      - name: Remove old beta builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          api="${{ github.server_url }}/api/v1/packages/${{ github.repository_owner }}"
          curl -sf -H "Authorization: token $TOKEN" "$api?type=generic&q=$PACKAGE&limit=200" \
            | jq -r --arg p "$PACKAGE" '[.[] | select(.name == $p and (.version | test("-dev")))] | sort_by(.created_at) | reverse | .['"$KEEP_BUILDS"':] | .[].version' \
            | while read -r v; do
                curl -sf -X DELETE -H "Authorization: token $TOKEN" "$api/generic/$PACKAGE/${v//+/%2B}" && echo "removed $PACKAGE $v"
              done

  docker:
    name: Docker image
    needs: [check, places]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        # All history and tags: scripts/version.sh describes the commit from the newest tag.
        with:
          fetch-depth: 0
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: towns-db
          path: data
      # The automatic token can't push packages, so this uses a token with package write access.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: version
        run: |
          echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PHOTO_STAMP_VERSION=${{ steps.version.outputs.version }}
      - name: Remove old sha- tags
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: scripts/ci-prune-images.sh photo-stamp
      # The image is in the registry now; the local copy isn't needed.
      - name: Remove local images
        if: always()
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do docker image rm "$tag" >/dev/null 2>&1 || true; done

  tidy:
    name: Tidy the runner
    # After everything else, on every run: remove leftovers of runs that didn't clean up (e.g.
    # cancelled), and keep the shared caches bounded.
    needs: [check, check-windows, places, windows, docker]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove leftover per-run target volumes
        run: |
          # In-use ones (another run still going) refuse to go and are left alone.
          for v in $(docker volume ls -q --filter name=photo-stamp-dev-target-run-); do
            docker volume rm "$v" >/dev/null 2>&1 && echo "removed volume $v"
          done
      - name: Remove old dev images
        run: |
          current="photo-stamp-dev:$(sha256sum docker/Dockerfile | cut -c1-12)"
          for img in $(docker image ls --format '{{.Repository}}:{{.Tag}}' photo-stamp-dev); do
            [ "$img" = "$current" ] || { docker image rm "$img" >/dev/null 2>&1 && echo "removed $img"; }
          done
          docker image prune -f >/dev/null
      - name: Keep the shared caches bounded
        run: |
          # Docker's build cache (the Windows codecs, Rust layers): at most 20 GB.
          docker builder prune -f --keep-storage 20GB >/dev/null 2>&1 || docker builder prune -f --max-used-space 20GB >/dev/null 2>&1 || true
          # Main's cargo target volume: start over if it passes 25 GB.
          if docker volume inspect photo-stamp-dev-target >/dev/null 2>&1; then
            current="photo-stamp-dev:$(sha256sum docker/Dockerfile | cut -c1-12)"
            kb=$(docker run --rm -v photo-stamp-dev-target:/t "$current" du -sk /t 2>/dev/null | cut -f1 || echo 0)
            echo "main's target volume: $((kb / 1048576)) GB"
            if [ "${kb:-0}" -gt $((25 * 1048576)) ]; then
              docker volume rm photo-stamp-dev-target >/dev/null 2>&1 && echo "removed main's target volume (over 25 GB)"
            fi
          fi
          docker system df

  release:
    name: GitHub Release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      # Releases are published on GitHub. Forgejo push-mirrors the repo there, tags included.
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      GH_REPO: daterrell/photo-stamp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only commits that made it to main are released.
      - name: Tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main; tag a commit on main to release it"
            exit 1
          fi
      - name: Get the published build
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="${{ github.server_url }}/api/packages/${{ github.repository_owner }}/generic/$PACKAGE/$version"
          curl -sfL -H "Authorization: token $TOKEN" -o photo-stamp-windows.zip "$base/photo-stamp-windows-$version.zip"
          curl -sfL -H "Authorization: token $TOKEN" -o photo-stamp-setup.exe "$base/photo-stamp-setup-$version.exe"
      - name: Install gh
        run: |
          curl -fsSL https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz | tar xz -C /tmp
          sudo install /tmp/gh_2.102.0_linux_amd64/bin/gh /usr/local/bin/gh
      - name: Wait for the push mirror to bring the tag to GitHub
        run: |
          for _ in $(seq 60); do
            gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --silent 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::$GITHUB_REF_NAME didn't reach github.com/$GH_REPO; check the repo's push mirror."
          exit 1
      - name: Create release
        run: |
          zip="photo-stamp-windows-${GITHUB_REF_NAME}.zip"
          setup="photo-stamp-setup-${GITHUB_REF_NAME}.exe"
          mv photo-stamp-windows.zip "$zip"
          mv photo-stamp-setup.exe "$setup"
          {
            echo "**Windows:** download \`$setup\` and run it. It asks where you'll drop photos, then"
            echo "Photo Stamp runs by the clock and starts whenever you log in; it updates itself."
            echo "If Windows says it protected your PC, click **More info**, then **Run anyway**."
            echo
            echo "The zip holds the same program, for updates and manual installs."
            echo
            echo "Docker image: \`${REGISTRY}/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$setup" "$zip" --verify-tag --title "photo-stamp $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes
          rm -f "$zip" "$setup" /usr/local/bin/gh
