[package]
name = "photo-stamp"
version = "0.3.0"
edition = "2024"
description = "Burn when/where a photo was taken into the image, using its EXIF data"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
bytes = "1.12.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
cosmic-text = "0.19.0"
image = "0.25.10"
imageproc = { version = "0.27.0", default-features = false }
libheif-rs = { version = "3.0.0", optional = true }
log = "0.4.34"
notify = "8.2.0"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tzf-rs = "2.1.2"
ureq = "3.4.2"
walkdir = "2.5.0"

[features]
default = ["heif"]
# HEIC/HEIF support via the system libheif (needs libheif-dev to build).
heif = ["dep:libheif-rs"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[profile.release]
strip = true
