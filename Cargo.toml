[package]
name = "photo-stamp"
version = "0.1.0"
edition = "2024"
description = "Burn when/where a photo was taken into the image, using its EXIF data"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
image = "0.25.10"
imageproc = "0.27.0"
img-parts = "0.4.0"
kamadak-exif = "0.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"
