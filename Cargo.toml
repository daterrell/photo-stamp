[workspace]
members = ["http", "proto"]

[package]
name = "photo-stamp"
# Not the real version: that comes from the git tag (scripts/version.sh).
version = "0.0.0"
edition = "2024"
description = "Burn when/where a photo was taken into the image, using its EXIF data"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
cosmic-text = "0.19.0"
image = "0.25.10"
imageproc = { version = "0.27.0", default-features = false }
libheif-rs = { version = "3.0.0", optional = true }
log = "0.4.34"
notify = "8.2.0"
photo-stamp-http = { path = "http" }
photo-stamp-proto = { path = "proto", features = ["places"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tzf-rs = "2.1.2"
ureq = "3.4.2"
walkdir = "2.5.0"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[features]
default = ["heif"]
# HEIC/HEIF support via the system libheif (needs libheif-dev to build).
heif = ["dep:libheif-rs"]

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Com"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Security"] }

[profile.release]
strip = true
