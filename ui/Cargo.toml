[package]
name = "photo-stamp-ui"
version = "0.6.0"
edition = "2024"
description = "Dashboard for photo-stamp: shows and controls the drop-folder service in your browser"
license = "MIT"
publish = false

[dependencies]
photo-stamp-http = { path = "../http" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
