[package]
name = "photo-stamp-server"
version = "0.7.0"
edition = "2024"
description = "Place server for photo-stamp: holds the full place data and names points for its clients"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.3.4"
log = "0.4.34"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
photo-stamp-http = { path = "../http" }
photo-stamp-proto = { path = "../proto", features = ["places"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
ureq = "3.4.2"
